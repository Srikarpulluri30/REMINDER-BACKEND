# ===================================================================
# Smart Reminder Application Configuration
# ===================================================================
spring.application.name=smart-reminder-backend
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_reminder_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT (JSON Web Token) Security Settings
# ===================================================================
# 256-bit (32+ character) secure secret key for HMAC-SHA signing
app.jwt.secret=SmartReminderSecretKeyForJwtAuthentication2026AcademicProjectMustBeLongEnough!
# Token validity duration: 24 hours in milliseconds (24 * 60 * 60 * 1000 = 86400000)
app.jwt.expiration-ms=86400000

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.smartreminder=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cache=DEBUG

# ===================================================================
# Spring Boot Actuator Monitoring Endpoints
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ===================================================================
# Spring Cache Configuration
# ===================================================================
spring.cache.type=concurrent
spring.cache.cache-names=users,reminders,adminStats
