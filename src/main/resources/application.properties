# ===================================================================
# Smart Reminder Application Configuration (Render Deployment & Local)
# ===================================================================
spring.application.name=smart-reminder-backend

# Server Port: Render injects the PORT environment variable
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (PostgreSQL on Render / local fallback)
# ===================================================================
# If deployed on Render with PostgreSQL, SPRING_DATASOURCE_URL or DATABASE_URL is used.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_reminder_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# HikariCP Connection Pool (sized for Render free tier connection limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Automatically creates/updates PostgreSQL tables while preserving data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CORS (Cross-Origin Resource Sharing) Settings
# ===================================================================
# Allows requests from Vercel deployed frontend and local dev environments
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://reminder-frontend-akch.vercel.app,http://localhost:5173,http://localhost:3000}

# ===================================================================
# JWT (JSON Web Token) Security Settings
# ===================================================================
app.jwt.secret=${JWT_SECRET:SmartReminderSecretKeyForJwtAuthentication2026AcademicProjectMustBeLongEnough!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.smartreminder=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cache=INFO
logging.level.org.hibernate=WARN

# ===================================================================
# Spring Boot Actuator Monitoring Endpoints
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ===================================================================
# Spring Cache Configuration
# ===================================================================
spring.cache.type=concurrent
spring.cache.cache-names=users,reminders,adminStats
