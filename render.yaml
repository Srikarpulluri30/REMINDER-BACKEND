databases:
  - name: smart-reminder-db
    databaseName: smart_reminder_db
    user: reminder_user
    plan: free
    region: oregon

services:
  - type: web
    name: smart-reminder-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: smart-reminder-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://reminder-frontend-akch.vercel.app,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
